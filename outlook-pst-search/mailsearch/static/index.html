<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="mail-session" content="__LOCAL_SESSION__">
  <title>보관 메일 검색</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="m4 7 8 6 8-6"/></svg>
        </span>
        보관 메일 검색
      </div>
      <div class="masthead-actions">
        <span class="local">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 4v2"/></svg>
          로컬 실행
        </span>
        <button type="button" class="button settings-trigger" id="settings-open" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M8 4v5m0 5v6m8-16v9m0 4v3"/><circle cx="8" cy="11.5" r="2.5"/><circle cx="16" cy="15" r="2.5"/></svg>
          API 설정
        </button>
      </div>
    </div>
  </header>

  <div class="layout">
    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <h1 id="page-title">필요한 메일을<br><span>다시 찾으세요.</span></h1>
          <p>품번, 발신자, 기억나는 문장으로 보관 메일을 찾아보세요.</p>
        </div>
        <div class="hero-art" aria-hidden="true">
          <div class="art-orbit"></div>
          <div class="art-paper art-paper-back"></div>
          <div class="art-paper art-paper-front">
            <div class="art-paper-tab"></div>
            <div class="art-lines"></div>
          </div>
          <div class="art-envelope"></div>
          <div class="art-glass"></div>
          <div class="art-star">
            <svg viewBox="0 0 40 40" fill="none"><path d="M20 6v28M6 20h28M10 10l20 20m0-20L10 30"/></svg>
          </div>
          <span class="art-plus">+</span>
        </div>
      </section>

      <div class="tabs" role="tablist" aria-label="검색 대상">
        <button type="button" id="tab-mail" class="tab active" role="tab" aria-selected="true">메일</button>
        <button type="button" id="tab-doc" class="tab" role="tab" aria-selected="false">문서</button>
        <button type="button" id="tab-pcf" class="tab" role="tab" aria-selected="false">PCF</button>
      </div>

      <form id="search-form" class="search-form" role="search" aria-label="보관 메일 검색">
        <label for="query" class="search-label">검색어 또는 질문</label>
        <div class="search-line">
          <div class="query-box">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg>
            <input id="query" type="search" maxlength="450" placeholder="예: A-17 납품일은 최종 언제로 정해졌지?" aria-keyshortcuts="/">
            <kbd aria-hidden="true">/</kbd>
          </div>
          <button id="submit-search" class="button primary" name="intent" value="search" type="submit">검색</button>
          <button id="submit-ask" class="button ai-button" name="intent" value="ask" type="submit" title="Ctrl+Enter">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 3c.7 4.4 3.6 7.3 8 8-4.4.7-7.3 3.6-8 8-.7-4.4-3.6-7.3-8-8 4.4-.7 7.3-3.6 8-8Zm7 13v5m-2.5-2.5h5"/></svg>
            AI에게 질문
          </button>
        </div>
        <label class="design-toggle"><input id="design-mode" type="checkbox">설계 이력 질문</label>
        <label class="design-scope" hidden>답변 범위<select id="design-scope"><option value="">전체 보관함</option></select></label>
        <details class="filters" id="filter-panel">
          <summary>
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2"/><circle cx="16" cy="12" r="2"/><circle cx="10" cy="17" r="2"/></svg>
            검색 범위 <span id="filter-count" class="filter-count" hidden></span>
            <svg class="chevron" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg>
          </summary>
          <div class="filter-body">
            <div class="filter-grid">
              <label>주제<input id="subject" maxlength="200"></label>
              <label>본문<input id="body" maxlength="200"></label>
              <label data-mail-only>발신자<input id="sender" maxlength="200"></label>
              <label data-mail-only>수신자<input id="recipient" maxlength="200"></label>
              <label data-mail-only>첨부<select id="attachment"><option value="">전체</option><option value="yes">있음</option><option value="no">없음</option></select></label>
              <label>시작일<input id="after" type="date"></label>
              <label>종료일<input id="before" type="date"></label>
            </div>
            <button id="clear-filters" type="button" class="text-button" hidden>검색 범위 초기화</button>
          </div>
        </details>
        <div id="context" class="context" hidden>
          <span id="context-text"></span><button type="button" id="clear-context" class="text-button">지우기</button>
        </div>
      </form>

      <p id="notice" class="notice" role="status"></p>

      <section id="answer" class="answer" aria-live="polite" hidden></section>
      <section id="result-section" class="result-section" hidden aria-labelledby="result-heading">
        <h2 id="result-heading">검색 결과</h2>
        <div id="results" class="results"></div>
      </section>
    </main>

    <aside class="sidebar" aria-labelledby="archive-heading">
      <div class="side-title">
        <span class="folder-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M3.5 7a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/><path d="M4 10h16"/></svg>
        </span>
        <h2 id="archive-heading">자료 보관함</h2>
      </div>
      <section class="source-group" data-kind="mail" aria-label="메일 자료">
        <h3 class="group-title">메일</h3>
        <button type="button" class="button add-button group-add" aria-controls="add-form-mail" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          메일 추가
        </button>
        <form id="add-form-mail" class="add-form" hidden>
          <label for="path-mail">PST 또는 EML 폴더 경로</label>
          <input id="path-mail" placeholder="C:\메일보관\2025.pst 또는 EML 폴더" required spellcheck="false">
          <button type="submit" class="button small primary">등록</button>
          <p class="form-message add-notice" role="status"></p>
        </form>
        <div class="sources" data-kind="mail" aria-label="등록한 메일 자료"></div>
      </section>
      <section class="source-group" data-kind="document" aria-label="문서 자료">
        <h3 class="group-title">문서</h3>
        <button type="button" class="button add-button group-add" aria-controls="add-form-doc" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          문서 추가
        </button>
        <form id="add-form-doc" class="add-form" hidden>
          <label for="path-doc">문서 파일 또는 폴더 경로</label>
          <input id="path-doc" placeholder="문서 폴더 또는 PDF·DOCX·XLSX·TXT 파일" required spellcheck="false">
          <button type="submit" class="button small primary">등록</button>
          <p class="form-message add-notice" role="status"></p>
        </form>
        <div class="sources" data-kind="document" aria-label="등록한 문서 자료"></div>
      </section>
      <section class="source-group" data-kind="pcf" aria-label="PCF 자료">
        <h3 class="group-title">PCF <span class="group-hint">선주 교신문</span></h3>
        <button type="button" class="button add-button group-add" aria-controls="add-form-pcf" aria-expanded="false">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          PCF 문서 추가
        </button>
        <form id="add-form-pcf" class="add-form" hidden>
          <label for="path-pcf">PCF 문서 파일 또는 폴더 경로</label>
          <input id="path-pcf" placeholder="PCF 문서 폴더 또는 파일 (파일명에 PCF가 들어간 문서)" required spellcheck="false">
          <button type="submit" class="button small primary">등록</button>
          <p class="form-message add-notice" role="status"></p>
        </form>
        <div class="sources" data-kind="pcf" aria-label="등록한 PCF 자료"></div>
      </section>
      <div class="model-panels">
        <div class="model-panel">
          <span class="model-dot" aria-hidden="true"></span>
          <p id="model-status">로컬 AI 설정 확인 중</p>
        </div>
        <div class="model-panel" id="external-panel">
          <span class="model-dot" aria-hidden="true"></span>
          <p id="external-status">외부 API 연결 전</p>
        </div>
      </div>
    </aside>
  </div>

  <dialog id="settings-dialog" class="settings-dialog" aria-labelledby="settings-title">
    <form id="settings-form" autocomplete="off">
      <header class="viewer-header">
        <h2 id="settings-title">외부 AI API 설정</h2>
        <button type="button" class="square" id="settings-close" aria-label="API 설정 닫기">×</button>
      </header>
      <div class="viewer-content">
        <p class="settings-summary" id="settings-current">설정을 불러오는 중입니다.</p>
        <div class="settings-fields">
          <label for="settings-url">API 주소</label>
          <input id="settings-url" type="url" maxlength="512" required spellcheck="false" aria-describedby="settings-endpoint-help">
          <p id="settings-endpoint-help">OpenAI 호환 주소는 /chat/completions로 끝나는 전체 HTTPS 주소를 입력하세요.</p>
          <label for="settings-model">모델명</label>
          <input id="settings-model" maxlength="150" required spellcheck="false">
          <label for="settings-key">API 키</label>
          <input id="settings-key" type="password" maxlength="2048" autocomplete="off" spellcheck="false" aria-describedby="settings-key-help">
          <p id="settings-key-help">GUI에 입력한 키는 앱을 종료할 때 지워집니다.</p>
        </div>
        <p id="settings-status" class="form-message" role="status"></p>
      </div>
      <footer class="settings-actions">
        <button type="button" id="settings-remove" class="text-button" hidden>연결 해제</button>
        <button type="button" id="settings-test" class="button" aria-describedby="settings-test-help">연결 테스트</button>
        <button type="submit" id="settings-apply" class="button primary">적용</button>
        <p id="settings-test-help">연결 테스트는 테스트 문구만 전송합니다.</p>
      </footer>
    </form>
  </dialog>
  <dialog id="viewer" aria-labelledby="viewer-title">
    <header class="viewer-header">
      <h2 id="viewer-title">원문</h2>
      <form method="dialog"><button class="square" aria-label="원문 닫기">×</button></form>
    </header>
    <div id="viewer-content" class="viewer-content"></div>
  </dialog>
</body>
</html>
